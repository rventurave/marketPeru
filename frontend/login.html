<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — MarketPeru</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/products.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="auth-layout">
    <div class="card auth-card">
      <h1 class="auth-card__title">Iniciar sesión</h1>
      <p class="auth-card__subtitle">Accede para contactar vendedores y gestionar tu cuenta.</p>

      <div id="form-alert" class="form-alert form-alert--error" hidden></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Correo electrónico</label>
          <input class="form-input" id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <div class="password-toggle">
            <input class="form-input" id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="password-toggle__btn" type="button" id="toggle-password" aria-label="Mostrar contraseña">Mostrar</button>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Iniciar sesión</button>
        </div>
      </form>

      <div class="form-divider">o</div>
      <p class="text-small muted" style="text-align:center;">
        ¿No tienes cuenta? <a href="register.html" id="register-link" style="color:var(--color-primary-dark);font-weight:600;">Regístrate</a>
      </p>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module">
    import { renderNavbar, renderFooter } from './js/navigation.js';
    import { login, redirectAfterAuth } from './js/auth.js';

    const returnTo = new URLSearchParams(window.location.search).get('returnTo') || '';
    const registerLink = document.getElementById('register-link');
    if (returnTo) registerLink.href = `register.html?returnTo=${encodeURIComponent(returnTo)}`;

    await renderNavbar(document.getElementById('site-header'));
    renderFooter(document.getElementById('site-footer'));

    const form = document.getElementById('login-form');
    const alert = document.getElementById('form-alert');
    const submitBtn = document.getElementById('submit-btn');
    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');

    toggleBtn.addEventListener('click', () => {
      const show = passwordInput.type === 'password';
      passwordInput.type = show ? 'text' : 'password';
      toggleBtn.textContent = show ? 'Ocultar' : 'Mostrar';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alert.hidden = true;
      const email = form.email.value.trim();
      const password = form.password.value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner" aria-hidden="true"></span> Iniciando sesión...';
      try {
        await login(email, password);
        redirectAfterAuth();
      } catch (err) {
        alert.textContent = err.message || 'No se pudo iniciar sesión';
        alert.hidden = false;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Iniciar sesión';
      }
    });
  </script>
</body>
</html>
