<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel — MarketPeru</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/products.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="page-header">
      <h1>Panel de usuario</h1>
      <p>Gestiona tus publicaciones, favoritos, conversaciones y perfil.</p>
    </div>

    <div class="dashboard-grid">
      <a class="card dashboard-card card--hover" href="publish.html">
        <span class="dashboard-card__title">Mis publicaciones</span>
        <span class="dashboard-card__status">Publica y administra tus productos</span>
      </a>
      <div class="card dashboard-card">
        <span class="dashboard-card__title">Mis favoritos</span>
        <span class="dashboard-card__status badge badge--warning">Pendiente</span>
      </div>
      <div class="card dashboard-card">
        <span class="dashboard-card__title">Mis conversaciones</span>
        <span class="dashboard-card__status badge badge--warning">Pendiente</span>
      </div>
      <a class="card dashboard-card card--hover" href="profile.html">
        <span class="dashboard-card__title">Mi perfil</span>
        <span class="dashboard-card__status">Ver y editar tu información</span>
      </a>
      <div class="card dashboard-card">
        <span class="dashboard-card__title">Mis calificaciones</span>
        <span class="dashboard-card__status badge badge--warning">Pendiente</span>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module">
    import { renderNavbar, renderFooter } from './js/navigation.js';
    import { isAuthenticated, redirectToLogin } from './js/auth.js';

    await renderNavbar(document.getElementById('site-header'));
    renderFooter(document.getElementById('site-footer'));

    if (!isAuthenticated()) {
      redirectToLogin('dashboard.html');
    }
  </script>
</body>
</html>
